name: Setup Perfetto UI build environment
description: |
  Restores all caches relevant to building the Perfetto UI (toolchain
  downloads, pnpm node_modules, ccache for the WASM C++ compile, and
  the out/ui incremental build state), configures ccache, clones the
  Perfetto checkout via sismo's install-build-deps, and runs Perfetto's
  install-build-deps --ui.

runs:
  using: composite
  steps:
    # Toolchain downloads from install-build-deps. Stable across commits;
    # full match keys off install_build_deps.py (which contains the pin),
    # restore-keys lets us fuzzy-restore a slightly stale cache when that
    # file changes for unrelated reasons (e.g. zig version bumps). The
    # downstream install-build-deps run reconciles whatever's missing and
    # restores tracked-file mtimes from git so ninja's incremental tracking
    # against the cached out/ui still works after `git checkout --force`.
    - name: Cache buildtools + third_party
      uses: actions/cache@v5
      with:
        path: |
          third_party/src/perfetto/buildtools
          third_party/src/perfetto/third_party/pnpm
        key: perfetto-buildtools-${{ runner.os }}-${{ hashFiles('python/tools/install_build_deps.py') }}
        restore-keys: |
          perfetto-buildtools-${{ runner.os }}-

    # pnpm node_modules. The lockfile lives inside the perfetto checkout,
    # which isn't on disk yet at cache-restore time — key off the pin in
    # install_build_deps.py instead. restore-keys lets a stale node_modules
    # cache seed `pnpm install`, which then reconciles against the lockfile.
    - name: Cache ui/node_modules
      uses: actions/cache@v5
      with:
        path: third_party/src/perfetto/ui/node_modules
        key: perfetto-node-modules-${{ runner.os }}-${{ hashFiles('python/tools/install_build_deps.py') }}
        restore-keys: |
          perfetto-node-modules-${{ runner.os }}-

    # perfetto's test/data: fixture traces / protos pulled from GCS by
    # `tools/test_data` (each is fetched against a tracked .sha256 sidecar).
    # Cache only the downloaded blobs; the .sha256 sidecars come from the
    # perfetto checkout itself. Same fuzzy restore-keys pattern as above —
    # tools/test_data redownloads only the entries whose sidecars don't
    # match what's on disk.
    - name: Cache perfetto test/data
      uses: actions/cache@v5
      with:
        path: |
          third_party/src/perfetto/test/data
          !third_party/src/perfetto/test/data/**/*.sha256
        key: perfetto-test-data-${{ runner.os }}-${{ hashFiles('python/tools/install_build_deps.py') }}
        restore-keys: |
          perfetto-test-data-${{ runner.os }}-

    # Tool-specific Python venvs (currently just e2e-all-sources, which
    # pip-installs the `perfetto` package). Key off the file that pins
    # the package version; restore-keys lets a stale venv seed pip,
    # which then reconciles against the new pin.
    - name: Cache python venvs
      uses: actions/cache@v5
      with:
        path: third_party/venv
        key: python-venvs-${{ runner.os }}-${{ hashFiles('python/tools/e2e_all_sources.py') }}
        restore-keys: |
          python-venvs-${{ runner.os }}-

    # ccache for the WASM C++ compile (trace_processor, traceconv, etc).
    # Per-SHA key with a fuzzy restore-keys fallback so every run starts
    # from the most recent cache and writes a fresh layer at the end.
    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: perfetto-ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          perfetto-ccache-${{ runner.os }}-

    # Incremental build state. tsc, rollup, and ninja all use mtime-based
    # dep tracking; restoring out/ui means small source changes only
    # rebuild the touched files.
    - name: Cache out/ui
      uses: actions/cache@v5
      with:
        path: third_party/src/perfetto/out/ui
        key: perfetto-out-ui-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          perfetto-out-ui-${{ runner.os }}-

    # build.js auto-detects ccache on PATH (sets GN cc_wrapper="ccache").
    # ubuntu-latest does not preinstall ccache, so apt-install it first.
    - name: Install and configure ccache
      shell: bash
      run: |
        if ! command -v ccache >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
        fi
        mkdir -p ~/.ccache
        cat > ~/.ccache/ccache.conf <<'EOF'
        max_size = 2.0G
        compression = true
        compression_level = 6
        sloppiness = include_file_ctime,include_file_mtime
        compiler_check = string:${{ hashFiles('python/tools/install_build_deps.py') }}
        EOF
        ccache --zero-stats || true
        ccache --show-config

    # Clone the Perfetto checkout (third_party/src/perfetto) at the pinned
    # SHA and apply sismo's bridge patches/overlays. Idempotent across re-runs
    # and cache restores. Skips zig/rust since the UI build doesn't need them.
    - name: Set up Perfetto checkout
      shell: bash
      run: python3 tools/install-build-deps --no-zig --no-rust

    - name: Install Perfetto UI build deps
      shell: bash
      working-directory: third_party/src/perfetto
      run: python3 tools/install-build-deps --ui

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast Linux gate: pinned toolchains, the sismo-core unit tests, and the
  # sismo-core build. Nothing here needs Perfetto, so it stays quick and
  # dependency-light.
  #
  # The full sismo build + the CLI `--help` golden need libperfetto.a; that
  # heavier job lands alongside the dispatch port it exists to validate.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # third_party/bin is gitignored; cache the pinned zig + rust tarballs
      # so we only re-download when the pinned versions change.
      - name: Cache pinned toolchains
        uses: actions/cache@v4
        with:
          path: third_party/bin
          key: toolchains-${{ runner.os }}-${{ hashFiles('python/tools/install_build_deps.py') }}

      - name: Install pinned zig + rust
        run: python3 tools/install-build-deps --no-source all --no-patches

      # Building sismo-core compiles the kernel BPF object (sismo-sys), which
      # #include's <bpf/bpf_helpers.h> and needs clang with the bpf target.
      - name: Install BPF build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libbpf-dev clang

      - name: Unit tests (sismo-core)
        run: python3 tools/cargo --hermetic test --manifest-path crates/sismo-core/Cargo.toml

      - name: Build sismo-core
        run: python3 tools/cargo --hermetic build --manifest-path crates/sismo-core/Cargo.toml --profile dev

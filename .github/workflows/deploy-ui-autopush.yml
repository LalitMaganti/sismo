name: Deploy UI (Autopush)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ui-autopush
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache Perfetto buildtools
        uses: actions/cache@v5
        with:
          path: third_party/src/perfetto/buildtools
          key: perfetto-buildtools-${{ runner.os }}-${{ hashFiles('third_party/src/perfetto/tools/install-build-deps') }}

      - name: Install boto3
        run: pip install --user boto3

      - name: Build & deploy autopush
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 infra/sismo-ui/deploy_to_r2.py --channel=autopush --upload

# Standalone spike: prove kperf (PET) → kdebug → per-thread stacks on macOS,
# reusing the same KERN_KDEBUG drain sismo's sched capture uses. Not wired into
# the main binary; run as root against a target pid. Once the control plane +
# decode + kdebug coexistence are proven, this folds into macos_sched_capture as
# a second decoder on the unified kdebug session.

[package]
name = "kperf-spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
doctest = false

[[bin]]
name = "kperf-spike"
path = "src/main.rs"

[dependencies]
libc = "0.2"

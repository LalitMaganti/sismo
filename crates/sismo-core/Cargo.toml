[package]
name = "sismo-core"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# No runnable doc examples; testing otherwise invokes rustdoc, which isn't
# wired to the pinned toolchain.
doctest = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
sismo-proto = { path = "../sismo-proto" }
sismo-symbolize = { path = "../sismo-symbolize" }
# POSIX/libc bindings, so the callouts aren't hand-declared per file.
libc = "0.2"

# perf_event_open ABI (structs + syscall) for the Linux BPF CPU collector.
[target.'cfg(target_os = "linux")'.dependencies]
perf-event-open-sys = "4"
# Compiled kernel BPF object (sismo_sys::BPF_OBJ).
sismo-sys = { path = "../sismo-sys" }

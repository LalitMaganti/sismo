# The macOS heap preload: a DYLD_INSERT_LIBRARIES dylib that interposes malloc
# and streams sampled allocations to the recorder over a shm ring. It is
# injected into arbitrary target processes, so it depends on nothing heavy (no
# sismo-core) and carries its own tiny copies of the wire layout + ring
# (attach/write side) + control protocol (listen/accept side). libc is fine —
# it's compile-time bindings to the same libSystem the dylib already links.

[package]
name = "sismo-heap-preload"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# cdylib = the injected libsismo_heap.dylib; rlib = so the pure logic
# (sampler, wire) unit-tests standalone.
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"

[profile.release]
panic = "abort"    # never unwind into the injected target
opt-level = 2

[package]
name = "sismo-proto"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# No runnable doc examples; testing otherwise invokes rustdoc, which isn't
# wired to the pinned toolchain.
doctest = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

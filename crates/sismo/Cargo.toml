# The `sismo` binary crate: owns `main`, the build.rs that compiles + links the
# Perfetto C/C++ shims, and the sample-target workload. All logic lives in the
# sismo-core library it depends on.
[package]
name = "sismo"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "sismo"
path = "src/main.rs"

# The workload `sismo record` profiles. Shares this crate's Perfetto + libc++
# link (its TrackEvent shim is compiled into libsismo_cc_shims.a by build.rs).
[[bin]]
name = "sample-target"
path = "src/bin/sample_target.rs"

[dependencies]
sismo-core = { path = "../sismo-core" }
# The command layer (arg parsing + record/datasource/prepare/snapshot runners).
sismo-cli = { path = "../sismo-cli" }
# Pulls in the Perfetto C++ SDK + C/C++ shim compile + link via its build.rs.
# This is the crate that produces the final binaries, so it owns that link.
sismo-sys = { path = "../sismo-sys", features = ["perfetto-shim"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
